<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Badjet</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
:root{--bg:#f4f6f9;--card:#fff;--tx:#0f172a;--mut:#64748b;--ac:#0d9488;--ac2:#0f766e;--bad:#e11d48;--good:#059669;--bd:#e2e8f0;--hero:linear-gradient(135deg,#0f172a,#134e4a);--sh:0 1px 2px rgba(15,23,42,.04),0 4px 16px rgba(15,23,42,.05);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0f17;--card:#131a26;--tx:#e8edf5;--mut:#8a97ab;--ac:#2dd4bf;--ac2:#14b8a6;--bd:#1f2937;--hero:linear-gradient(135deg,#0f2a2e,#134e4a);--sh:none}}
:root[data-theme="dark"]{--bg:#0b0f17;--card:#131a26;--tx:#e8edf5;--mut:#8a97ab;--ac:#2dd4bf;--ac2:#14b8a6;--bd:#1f2937;--hero:linear-gradient(135deg,#0f2a2e,#134e4a);--sh:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
main{max-width:720px;margin:0 auto;padding:20px 16px 40px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:700;letter-spacing:-.02em}
.logo{width:32px;height:32px;border-radius:9px;background:var(--ac);color:#fff;display:grid;place-items:center;font-size:16px;font-weight:800}
.brand small{display:block;font-size:12px;font-weight:500;color:var(--mut);letter-spacing:0}
.sync{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:500;color:var(--mut);cursor:pointer;background:var(--card);border:1px solid var(--bd);padding:6px 12px;border-radius:999px;max-width:55%;text-align:right}
.sync:before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:var(--ac)}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:4px;margin-bottom:6px;background:var(--card);border:1px solid var(--bd);border-radius:12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:none;color:var(--mut);padding:8px 14px;border-radius:9px;font:inherit;font-weight:500;cursor:pointer;transition:.15s}
.tab:hover{color:var(--tx)}
.tab.on{background:var(--tx);color:var(--bg)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px;margin:14px 0;box-shadow:var(--sh)}
.card:has(>.big){background:var(--hero);border-color:transparent;color:#fff;padding:24px}
.card:has(>.big) .mut{color:rgba(255,255,255,.65)}
.card:has(>.big) .bar{background:rgba(255,255,255,.18)}
.card:has(>.big) .bar i{background:#5eead4}
.card:has(>.big) .amt.in{color:#6ee7b7}
.card:has(>.big) .amt.out{color:#fda4af}
.card:has(>.big) .sum{margin-top:18px;padding-top:16px;border-top:1px solid rgba(255,255,255,.14)}
.big{font-size:38px;font-weight:700;letter-spacing:-.03em;line-height:1.15;margin-top:2px}
.mut{color:var(--mut);font-size:13px}
.card b{font-weight:600}
.bar{height:8px;background:var(--bd);border-radius:99px;overflow:hidden;margin:12px 0 8px}
.bar i{display:block;height:100%;background:var(--ac);border-radius:99px}
.bar i.over{background:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap}
input,select,button{font:inherit;color:var(--tx)}
input,select{flex:1;min-width:110px;padding:11px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);outline:0;transition:.15s}
input:focus,select:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(13,148,136,.18)}
.btn{padding:11px 18px;border:0;border-radius:10px;background:var(--ac2);color:#fff;font-weight:600;cursor:pointer;transition:.15s}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--card);color:var(--tx);border:1px solid var(--bd);font-weight:500;font-size:14px;padding:9px 14px}
.btn.ghost:hover{border-color:var(--mut)}
.tx{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid var(--bd)}
.tx:first-child{border-top:0}
.amt{font-weight:600}
.amt.in{color:var(--good)}
.amt.out{color:var(--bad)}
.x{background:none;border:0;color:var(--mut);font-size:18px;cursor:pointer;padding:2px 8px;border-radius:6px;margin-left:4px}
.x:hover{background:var(--bg);color:var(--bad)}
.sum{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:left;margin-top:14px}
.sum b{display:block;font-size:16px;margin-top:2px}
.row2{display:flex;justify-content:space-between;font-size:14px;margin-top:12px}
.chk{display:flex;align-items:center;gap:8px;margin-top:12px;color:var(--mut);font-size:13px}
.chk input{flex:none;min-width:0}
.day{display:flex;justify-content:space-between;align-items:baseline;margin:22px 6px 0}
.day b{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);font-weight:600}
.day+.card{margin-top:8px;padding:6px 20px}
.time{color:var(--mut);font-size:12px}
.foot{text-align:center;margin:36px 0 0;color:var(--mut);font-size:12px;opacity:.7}
@media(max-width:480px){.big{font-size:32px}.card{padding:16px}.card:has(>.big){padding:20px}}
.ptitle{display:flex;justify-content:space-between;align-items:baseline}
.pnote{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--bg);font-size:14px}
.mo{border-top:1px solid var(--bd);padding:12px 0}
.mo summary{list-style:none;cursor:pointer}
.mo summary::-webkit-details-marker{display:none}
.mohead{display:flex;justify-content:space-between;align-items:baseline}
.tag{font-size:11px;font-weight:600;color:var(--ac2);background:var(--bg);border:1px solid var(--bd);padding:1px 8px;border-radius:99px;margin-left:6px}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:22px 6px 0}
.sec b{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);font-weight:600}
.sec+.card{margin-top:8px}
.grip{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;padding:4px 12px 4px 0;color:var(--mut);font-size:18px}
.tx.drag{background:var(--bg);box-shadow:0 6px 18px rgba(0,0,0,.2);border-radius:10px}
html{scroll-behavior:smooth}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
#view.enter>*{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
#view.enter>*:nth-child(2){animation-delay:.05s}
#view.enter>*:nth-child(3){animation-delay:.1s}
#view.enter>*:nth-child(4){animation-delay:.15s}
#view.enter>*:nth-child(5){animation-delay:.2s}
#view.enter>*:nth-child(n+6){animation-delay:.25s}
#view.enter .bar i{transform-origin:left;animation:grow .8s .15s cubic-bezier(.2,.8,.2,1) both}
.tab,.btn,.x,.sync,input,select,.card{transition:background-color .25s ease,color .25s ease,border-color .25s ease,box-shadow .25s ease,transform .2s ease,filter .2s ease}
.btn:active,.tab:active,.sync:active{transform:scale(.96)}
.card[data-go]:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(15,23,42,.1)}
.card[data-go]:active{transform:scale(.99)}
body>div[style*="z-index:9"]{animation:fade .2s ease both}
body>div[style*="z-index:9"]>.card{animation:pop .3s cubic-bezier(.2,.9,.3,1.15) both}
body>div.nopop>.card{animation:none}
.mo[open]>*:not(summary){animation:fade .3s ease both}
.tx{transition:background-color .2s ease,box-shadow .2s ease}
@media(prefers-reduced-motion:reduce){*,*:before{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
input,select{font-size:16px}
.tabs{position:sticky;top:8px;z-index:5;background:color-mix(in srgb,var(--card) 86%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.card:has(>.big){background:radial-gradient(circle at 92% 0%,rgba(94,234,212,.28),transparent 55%),var(--hero)}
#add,#dadd{width:100%;padding:13px}
.btn:focus-visible,.tab:focus-visible,.x:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
@keyframes slidein{from{opacity:0;transform:translateX(-14px);background:rgba(13,148,136,.16)}to{opacity:1;transform:none}}
.tx.new{animation:slidein .55s cubic-bezier(.2,.8,.2,1) both;border-radius:8px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .3s ease,transform .3s ease;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>

<body>

<main>

<div class="top">
  <div class="brand"><div class="logo">B</div><div>Badjet<small>Budget tracker</small></div></div>
  <span class="sync" id="sync">Checking...</span>
</div>

<div class="tabs" id="tabs"></div>
<div id="view"></div>

<div class="foot">Badjet · made by vlad</div>

</main>

<script>

const KEY="budget-v1";

let S={
  budgets:[
    {id:"b1",name:"Personal",limit:0,tx:[]},
    {id:"b2",name:"Business & Investing",limit:0,tx:[]}
  ]
};

let cur="all";
let ref=null;
let ready=false;
let fbOn=false;
let auth=null;
let fdb=null;
let unsub=null;
let saving=false;
let lastCur=null;
let fresh=null;

const $=id=>document.getElementById(id);

const fmt=n=>new Intl.NumberFormat(undefined,{style:"currency",currency:"PHP"}).format(n||0);

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const uid=()=>Math.random().toString(36).slice(2,9);


/* =========================
   DIALOG
========================= */

function dlg({title,msg,fields=[],ok="Save"}){
  return new Promise(res=>{

    const o=document.createElement("div");

    o.style.cssText=
      "position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9";

    o.innerHTML=`
      <div class="card" style="width:100%;max-width:360px;margin:0">

        <b>${esc(title)}</b>

        ${msg?`<p class="mut">${esc(msg)}</p>`:""}

        ${fields.map(f=>`
          <div style="margin-top:10px">

            <label class="mut">${esc(f.label)}</label>

            ${
              f.options
              ?
              `<select id="f_${f.id}" style="width:100%">
                ${f.options.map(([v,l])=>
                  `<option value="${v}">${esc(l)}</option>`
                ).join("")}
              </select>`
              :
              `<input
                id="f_${f.id}"
                type="${f.type||"text"}"
                ${f.type==="number"?'inputmode="decimal"':""}
                value="${esc(f.value??"")}"
                style="width:100%"
              >`
            }

          </div>
        `).join("")}

        <div class="row" style="margin-top:14px;justify-content:flex-end">
          <button class="btn ghost" id="dn">Cancel</button>
          <button class="btn" id="dy">${esc(ok)}</button>
        </div>

      </div>
    `;

    document.body.appendChild(o);

    const done=v=>{
      o.remove();
      res(v);
    };

    o.querySelector("#dn").onclick=()=>{done(null);};

    o.querySelector("#dy").onclick=()=>{
      const v={};
      fields.forEach(f=>{
        v[f.id]=o.querySelector("#f_"+f.id).value;
      });
      done(v);
    };

    const i=o.querySelector("input");
    if(i)i.focus();

  });
}


/* =========================
   DATE HELPERS
========================= */

const pad=n=>String(n).padStart(2,"0");

const stamp=()=>{
  const d=new Date();
  return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+"_"+pad(d.getHours())+"-"+pad(d.getMinutes());
};

const today=()=>{
  const d=new Date();
  return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
};

function toast(m){
  let t=$("toast");
  if(!t){t=document.createElement("div");t.id="toast";document.body.appendChild(t);}
  t.textContent=m;
  t.classList.remove("show");
  void t.offsetWidth;
  t.classList.add("show");
  clearTimeout(toast.h);
  toast.h=setTimeout(()=>t.classList.remove("show"),1800);
}

const nowTime=()=>{const d=new Date();return pad(d.getHours())+":"+pad(d.getMinutes())};

const fmtTime=t=>{
  if(!t)return "";
  const [h,m]=t.split(":").map(Number);
  return (h%12||12)+":"+pad(m)+" "+(h<12?"AM":"PM");
};

const dayLabel=ds=>{
  const [y,m,d]=ds.split("-").map(Number);
  const dt=new Date(y,m-1,d);
  const t=new Date();
  const yest=new Date(t.getFullYear(),t.getMonth(),t.getDate()-1);
  if(ds===today())return "Today";
  if(dt.getTime()===yest.getTime())return "Yesterday";
  return dt.toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric",year:"numeric"});
};

function history(list){
  if(!list.length)return `<div class="card"><div class="mut">No transactions yet.</div></div>`;
  const groups={};
  list.forEach(x=>(groups[x.date]=groups[x.date]||[]).push(x));
  return Object.keys(groups).sort().reverse().map(d=>{
    const net=groups[d].reduce((s,x)=>s+(x.type==="in"?1:-1)*(Number(x.amt)||0),0);
    return `
      <div class="day">
        <b>${esc(dayLabel(d))}</b>
        <span class="mut">${net>=0?"+":"−"}${fmt(Math.abs(net))}</span>
      </div>
      <div class="card">
        ${groups[d].map(x=>`
          <div class="tx ${x.id===fresh?"new":""}">
            <div>
              <div>${x.cat?`<span class="tag" style="margin:0 6px 0 0">${esc(x.cat)}</span>`:""}${esc(x.note||(x.cat?"":"—"))}</div>
              <div class="time">${x.time?"Added at "+fmtTime(x.time):"No time recorded"}</div>
            </div>
            <div>
              <span class="amt ${x.type}">${x.type==="in"?"+":"−"}${fmt(x.amt)}</span>
              <button class="x" data-d="${x.id}">×</button>
            </div>
          </div>`).join("")}
      </div>`;
  }).join("");
}


/* =========================
   SPENDING PERIOD
========================= */

const sk=x=>x.date+(x.time||"00:00")+String(x.ts||0).padStart(14,"0");
const dnum=ds=>{const [y,m,d]=ds.split("-").map(Number);return Date.UTC(y,m-1,d)};
const dayDiff=(a,b)=>Math.round((dnum(b)-dnum(a))/864e5);
const addDays=(ds,n)=>{const [y,m,d]=ds.split("-").map(Number);const t=new Date(y,m-1,d+n);return t.getFullYear()+"-"+pad(t.getMonth()+1)+"-"+pad(t.getDate())};
const sd=ds=>{const [y,m,d]=ds.split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString(undefined,{month:"short",day:"numeric"})};

function periodInfo(b){
  const p=b.period;
  if(!p||!(b.limit>0))return null;
  const end=addDays(p.start,p.days-1),td=today();
  const spent=b.tx.filter(t=>t.type==="out"&&!t.debt&&t.date>=p.start&&t.date<=end).reduce((s,t)=>s+(Number(t.amt)||0),0);
  const left=b.limit-spent;
  const ended=td>end,notStarted=td<p.start;
  const elapsed=ended?p.days:notStarted?0:dayDiff(p.start,td)+1;
  const remain=ended?0:notStarted?p.days:p.days-elapsed+1;
  return{p,end,spent,left,ended,notStarted,elapsed,remain,
    daily:remain?Math.max(0,left)/remain:0,
    avg:elapsed?spent/elapsed:0,
    pct:Math.min(100,spent/b.limit*100)};
}

function periodBar(b){
  const i=periodInfo(b);
  if(!i)return "";
  const st=i.ended?"Period ended":i.notStarted?"Starts "+sd(i.p.start):"Day "+i.elapsed+" of "+i.p.days+" · "+(i.remain-1)+" day"+(i.remain-1===1?"":"s")+" left";
  return `
    <div class="bar"><i class="${i.left<0?"over":""}" style="width:${i.pct}%"></i></div>
    <div class="mut">${i.left>=0?fmt(i.left)+" left of "+fmt(b.limit):fmt(-i.left)+" over "+fmt(b.limit)} · ${st}</div>`;
}

function periodCard(b){
  const i=periodInfo(b);
  if(!i)return "";
  let note;
  if(i.ended){
    note=i.left>=0
      ?"Period finished. You stayed within budget and kept "+fmt(i.left)+"."
      :"Period finished. You went over budget by "+fmt(-i.left)+".";
  }else if(i.notStarted){
    note="This period starts on "+sd(i.p.start)+".";
  }else if(i.left<0){
    note="You are already over budget by "+fmt(-i.left)+".";
  }else{
    const proj=i.avg*i.p.days,fin=b.limit-proj;
    note="At your current pace ("+fmt(i.avg)+"/day) you will spend about "+fmt(proj)+", ending with about "+
      (fin>=0?fmt(fin)+" left.":fmt(-fin)+" over budget.");
  }
  return `
    <div class="card">
      <div class="ptitle"><b>Spending period</b><span class="mut">${sd(i.p.start)} – ${sd(i.end)}</span></div>
      ${periodBar(b)}
      <div class="sum">
        <div><span class="mut">Spent</span><b class="amt out">${fmt(i.spent)}</b></div>
        <div><span class="mut">Left</span><b class="amt ${i.left>=0?"in":"out"}">${fmt(i.left)}</b></div>
        <div><span class="mut">Safe / day</span><b>${i.ended?"—":fmt(i.daily)}</b></div>
      </div>
      <div class="pnote">${note}</div>
      ${i.ended?`<div style="margin-top:12px"><button class="btn" id="np">Start new period</button></div>`:""}
    </div>`;
}


/* =========================
   MONTHLY HISTORY
========================= */

const mLong=k=>{const [y,m]=k.split("-").map(Number);return new Date(y,m-1,1).toLocaleDateString(undefined,{month:"long",year:"numeric"})};
const mShort=k=>{const [y,m]=k.split("-").map(Number);return new Date(y,m-1,1).toLocaleDateString(undefined,{month:"short"})};

function monthly(list,kind){

  const L=kind==="save"?["Deposited","Withdrawn"]:kind==="invest"?["Contributed","Sold"]:["Income","Spent"];
  const spend=kind!=="save"&&kind!=="invest";

  const M={};

  list.forEach(b=>b.tx.forEach(t=>{
    const k=(t.date||"").slice(0,7);
    if(!k)return;
    const m=M[k]=M[k]||{inc:0,exp:0,cat:{}};
    const a=Number(t.amt)||0;
    if(t.type==="in")m.inc+=a;
    else{
      m.exp+=a;
      const n=catOf(t);
      m.cat[n]=(m.cat[n]||0)+a;
    }
  }));

  const keys=Object.keys(M).sort().reverse();

  if(!keys.length)return "";

  const max=Math.max(...keys.map(k=>M[k].exp),1);

  const now=new Date();
  const curK=today().slice(0,7);
  const lm=new Date(now.getFullYear(),now.getMonth()-1,1);
  const lastK=lm.getFullYear()+"-"+pad(lm.getMonth()+1);

  const cE=(M[curK]||{exp:0}).exp;
  const lE=(M[lastK]||{exp:0}).exp;

  const chg=(a,b)=>b>0?Math.round((a-b)/b*100):null;

  const top=chg(cE,lE);

  const head=`
    <div class="sum" style="margin-top:12px">
      <div><span class="mut">This month</span><b>${fmt(cE)}</b></div>
      <div><span class="mut">Last month</span><b>${fmt(lE)}</b></div>
      <div><span class="mut">Change</span><b class="${top==null?"":(spend?(top>0?"amt out":"amt in"):"")}">${top==null?"—":(top>0?"▲ ":top<0?"▼ ":"")+Math.abs(top)+"%"}</b></div>
    </div>`;

  const rows=keys.slice(0,12).map((k,i)=>{

    const m=M[k];
    const prev=M[keys[i+1]];
    const c=prev?chg(m.exp,prev.exp):null;
    const net=m.inc-m.exp;
    const tag=k===curK?"This month":k===lastK?"Last month":"";
    const cats=Object.entries(m.cat).sort((a,b)=>b[1]-a[1]).slice(0,4);

    return `
      <details class="mo">
        <summary>
          <div class="mohead">
            <b>${esc(mLong(k))}${tag?` <span class="tag">${tag}</span>`:""}</b>
            <span class="amt out">${fmt(m.exp)}</span>
          </div>
          <div class="bar" style="margin:8px 0 6px"><i style="width:${m.exp/max*100}%"></i></div>

const CATS_OUT=["Food","Transport","Bills","Shopping","Health","Entertainment","Other"];
const CATS_IN=["Salary","Business","Gift","Other"];

const ensureCats=()=>{
  if(!S.catl){
    const ex=t=>((S.cats||{})[t]||[]);
    S.catl={
      out:CATS_OUT.concat(ex("out").filter(c=>!CATS_OUT.includes(c))),
      in:CATS_IN.concat(ex("in").filter(c=>!CATS_IN.includes(c)))
    };

};

const catList=type=>{ensureCats();return S.catl[type==="in"?"in":"out"];};

function manageCats(type){
  return new Promise(res=>{
    const o=document.createElement("div");
    o.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9";
    const draw=()=>{
      const L=catList(type);
      o.innerHTML=`
        <div class="card" style="width:100%;max-width:360px;margin:0;max-height:80vh;overflow:auto">

          </div>

          <div class="row" style="margin-top:12px;justify-content:flex-end"><button class="btn ghost" id="md">Done</button></div>
        </div>`;
      o.querySelectorAll("[data-i]").forEach(el=>el.onclick=()=>{L.splice(+el.dataset.i,1);save(true);draw();});
      o.querySelectorAll(".grip").forEach(g=>{
        g.onpointerdown=e=>{
          e.preventDefault();
          const row=g.closest(".tx"),box=row.parentNode;
          row.classList.add("drag");
          g.setPointerCapture(e.pointerId);
          g.onpointermove=ev=>{
            const sib=[...box.children].filter(r=>r!==row);
            const next=sib.find(r=>{const b=r.getBoundingClientRect();return ev.clientY<b.top+b.height/2;});
            if(next!==row.nextElementSibling)box.insertBefore(row,next||null);
          };
          g.onpointerup=g.onpointercancel=()=>{
            g.onpointermove=g.onpointerup=g.onpointercancel=null;
            const names=[...box.children].map(r=>r.dataset.c);
            L.splice(0,L.length,...names);
            save(true);
            draw();
          };
        };
      });
      o.querySelector("#ma").onclick=()=>{

        if(n&&!L.includes(n)){L.push(n);save(true);}
        draw();
      };
      o.querySelector("#md").onclick=()=>{o.remove();res();};
    };
    draw();
    document.body.appendChild(o);
    setTimeout(()=>o.classList.add("nopop"),400);
  });
}

const catOf=t=>{
  const c=(t.cat||"").trim();
  if(c)return c;
  const n=(t.note||"").trim();
  return n?n.charAt(0).toUpperCase()+n.slice(1).toLowerCase():"Uncategorized";
};

========================= */

const legacyDc=()=>debtSums().open.filter(d=>!d.bid).reduce((s,d)=>s+(d.dir==="owe"?1:-1)*dRem(d),0);

const dRem=d=>d.amt-(d.pays||[]).reduce((s,p)=>s+(Number(p.amt)||0),0);

function debtSums(){
  const open=(S.debts||[]).filter(d=>dRem(d)>0.005);
  const f=k=>open.filter(d=>d.dir===k).reduce((s,d)=>s+dRem(d),0);
  return{open,owe:f("owe"),owed:f("owed")};
}

function debtCard(){
  const x=debtSums();
  if(!x.open.length)return "";
  const t=totals(S.budgets),cash=t.inc-t.exp+legacyDc(),worth=cash+x.owed-x.owe;
  return `
    <div class="card" data-go="debts" style="cursor:pointer">
      <b>Debts</b>
      <div class="sum">
        <div><span class="mut">I owe</span><b class="amt out">${fmt(x.owe)}</b></div>
        <div><span class="mut">Owed to me</span><b class="amt in">${fmt(x.owed)}</b></div>
        <div><span class="mut">Net worth</span><b>${fmt(worth)}</b></div>
      </div>
      <div class="pnote">Money you borrowed or lent is recorded in the budget you picked, so your balances already include it. Net worth is your balances plus what you are owed, minus what you owe.</div>
    </div>`;
}

/* =========================
   RECURRING
========================= */

function applyRec(){

  S.rec=S.rec||[];

  let ch=false;

  const td=today();

  S.rec.forEach(r=>{

    const b=S.budgets.find(x=>x.id===r.bid);

    if(!b)return;

    let n=0;

    while(r.next<=td&&n++<60){

      const id="r"+r.id+r.next;

      if(!b.tx.some(t=>t.id===id)){

        b.tx.push({
          id,
          type:r.type,
          amt:r.amt,
          note:r.note,
          cat:r.cat,
          date:r.next,
          time:r.time
        });

      }

      const [y,m]=r.next.split("-").map(Number);

      const d=new Date(y,m,1);

      r.next=
        d.getFullYear()+"-"+
        pad(d.getMonth()+1)+"-"+
        pad(Math.min(r.day,28));

      ch=true;

    }

  });

  return ch;
}

function gainLine(b,t){

  if(b.value==null)

  const g=b.value-inv;

        ${g>=0?"+":"−"}${fmt(Math.abs(g))}
        (${p.toFixed(1)}%)
      </span>
    </div>
  `;
}

========================= */

function chart(list){

  const m={};

  let tot=0;

  list.forEach(b=>
    b.tx.forEach(t=>{

      if(t.type==="out"&&!t.debt){

        const c=catOf(t);

        m[c]=(m[c]||0)+t.amt;

        tot+=t.amt;

      }

    })
  );

  const e=Object.entries(m).sort((a,b)=>b[1]-a[1]);

  return `
    <div class="card">

      <b>Spending by category</b>

      ${
        e.length
        ?
        e.map(([c,v])=>`

          <div class="row2">
            <span>${esc(c)}</span>
            <span class="mut">${fmt(v)} · ${Math.round(v/tot*100)}%</span>
          </div>

          <div class="bar" style="margin:4px 0">
            <i style="width:${v/tot*100}%"></i>
          </div>

        `).join("")
        :
        `<div class="mut">No expenses yet.</div>`
      }

    </div>
  `;
}


/* =========================
   CSV EXPORT
========================= */

function exportCSV(list,name){

  const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"';

  let totalIncome=0;
  let totalExpense=0;

  const rows=[];


  /* HEADER */

  rows.push([
    "Budget",
    "Date",
    "Time",
    "Type",
    "Category",
    "Note",
    "Amount",
    "Amount Left"
  ].map(q).join(","));


  /* TRANSACTIONS */

  list.forEach(b=>{

    let balance=0;

    const sorted=[...b.tx].sort((a,c)=>
      (a.date+(a.time||"")).localeCompare(c.date+(c.time||"")));


    sorted.forEach(t=>{

      const amount=Number(t.amt)||0;

      if(t.type==="in"){
        totalIncome+=amount;
        balance+=amount;
      }else{
        totalExpense+=amount;
        balance-=amount;
      }

      rows.push([
        b.name,
        t.date,
        t.time||"",
        t.type==="in"?"Income":"Expense",
        t.cat||"",
        t.note||"",
        t.type==="in"?"+"+amount.toFixed(2):"-"+amount.toFixed(2),
        balance.toFixed(2)
      ].map(q).join(","));

    });

  });


  /* TOTALS */

  const totalLeft=totalIncome-totalExpense;

  rows.push("");

  rows.push(["TOTAL INCOME",totalIncome.toFixed(2)].map(q).join(","));

  rows.push(["TOTAL EXPENSES","-"+totalExpense.toFixed(2)].map(q).join(","));

  rows.push(["TOTAL AMOUNT LEFT",totalLeft.toFixed(2)].map(q).join(","));


  /* DOWNLOAD */

  const csv=rows.join("\r\n");

  const blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8;"});

  const url=URL.createObjectURL(blob);

  const a=document.createElement("a");

  a.href=url;

  a.download=name+"_"+stamp()+".csv";

  document.body.appendChild(a);

  a.click();

  a.remove();

  setTimeout(()=>URL.revokeObjectURL(url),1000);

}

async function save(noRender){

  try{

    localStorage.setItem(KEY,json);

    if(!noRender)render();


    if(fbOn && auth && auth.currentUser && ref){

      saving=true;

      $("sync").textContent="Saving...";

      await ref.set({
        json:json,
        updatedAt:firebase.firestore.FieldValue.serverTimestamp()
      });

      saving=false;

      $("sync").textContent="Synced ✓";

    }

  }catch(e){

    saving=false;

    console.error("Save error:",e);

    $("sync").textContent="Sync error";

  }

}


/* =========================
   TOTALS
========================= */

function totals(list){

  let inc=0;
  let exp=0;
  let lim=0;

  list.forEach(b=>{

    if(b.kind!=="save" && b.kind!=="invest" && !b.period)
      lim+=+b.limit||0;

    b.tx.forEach(t=>
      t.type==="in"
      ?inc+=Number(t.amt)||0
      :exp+=Number(t.amt)||0
    );

  });

  return{inc,exp,lim};

}

/* =========================
   LIMIT BAR
========================= */

function limitBar(t,kind){

  if(!t.lim)return "";


  if(kind==="save" || kind==="invest"){

    const sv=t.inc-t.exp;

    const p=Math.max(0,Math.min(100,sv/t.lim*100));

    return `

      <div class="bar">
        <i style="width:${p}%"></i>
      </div>

      <div class="mut">
        ${fmt(sv)}
        ${kind==="save"?"saved":"invested"}
        of ${fmt(t.lim)}
        goal (${Math.round(p)}%)
      </div>

    `;

  }


  const p=Math.min(100,t.exp/t.lim*100);

  const left=t.lim-t.exp;

  return `

    <div class="bar">
      <i class="${left<0?"over":""}" style="width:${p}%"></i>
    </div>

    <div class="mut">
      ${
        left>=0
        ?fmt(left)+" left of "+fmt(t.lim)
        :fmt(-left)+" over "+fmt(t.lim)
      }
    </div>

  `;

}

  `

    <div class="card">

      <div class="mut">${esc(b.name)} balance</div>

      <div class="big">${fmt(t.inc-t.exp)}</div>

      ${summary(t,b.kind)}

      ${limitBar(b.period?{...t,lim:0}:t,b.kind)}

    </div>


    ${periodCard(b)}

    <div class="card">

      <div class="row">

        <select id="type">

          ${
            b.kind==="save"
            ?`<option value="in">Deposit</option><option value="out">Withdraw</option>`
            :b.kind==="invest"
            ?`<option value="in">Contribute</option><option value="out">Sell / withdraw</option>`
            :`<option value="out">Expense</option><option value="in">Income</option>`
          }

        </select>

        <input id="amt" type="number" inputmode="decimal" placeholder="Amount">

      </div>


      ${(!b.kind||b.kind==="spend")?`<div class="row" style="margin-top:8px"><select id="cat"></select></div>`:""}

      <div class="row" style="margin-top:8px">

        <input id="note" placeholder="Note: what was this for?">

        <input id="date" type="date" value="${today()}">

      </div>


      <label class="chk">
        <input type="checkbox" id="rep">
        Repeat monthly (recurring bill / income)
      </label>


      <div style="margin-top:10px">
        <button class="btn" id="add">Add</button>
      </div>

    </div>


    ${
      b.kind==="invest"
      ?`
        <div class="card">
          <b>Performance</b>
          <div style="margin-top:6px">${gainLine(b,t)}</div>
        </div>
      `
      :""
    }


    ${
      b.kind==="save" || b.kind==="invest"
      ?""
      :chart([b])
    }


    ${
      (S.rec||[]).filter(r=>r.bid===b.id).length
      ?`
        <div class="card">

          <b>Recurring monthly</b>

          ${
            S.rec
            .filter(r=>r.bid===b.id)
            .map(r=>`

              <div class="tx">

                <div>
                  ${esc(r.note||r.cat)}
                  <div class="mut">Next: ${r.next}</div>
                </div>

                <div>
                  <span class="amt ${r.type}">${fmt(r.amt)}</span>
                  <button class="x" data-r="${r.id}">×</button>
                </div>

              </div>

            `)
            .join("")
          }

        </div>
      `
      :""
    }


    ${monthly([b],b.kind)}

    ${history(list)}


    <div class="row">

      ${
        b.kind==="invest"
        ?`<button class="btn ghost" id="val">Update current value</button>`
        :""
      }

      <button class="btn ghost" id="exp">Export CSV</button>

      <button class="btn ghost" id="lim">
        ${
          b.kind==="save"
          ?"Set savings goal"
          :b.kind==="invest"
          ?"Set investment goal"
          :"Set spending limit"
        }
      </button>

      <button class="btn ghost" id="ren">Rename</button>

      <button class="btn ghost" id="del">Delete budget</button>

    </div>

  `;


  const catSel=$("cat");

  if(catSel){

    const fill=sel=>{
      catSel.innerHTML=(catList($("type").value).length?"":`<option value="">No category</option>`)+catList($("type").value).map(c=>`<option>${esc(c)}</option>`).join("")+`<option value="__manage">✎ Manage categories…</option>`;
      if(sel)catSel.value=sel;
    };

    fill();

    $("type").onchange=()=>fill();

    catSel.onchange=async()=>{
      if(catSel.value!=="__manage")return;
      await manageCats($("type").value);
      fill();
    };

  }


  $("add").onclick=()=>{

    const a=parseFloat($("amt").value);

    if(!(a>0))return;


    const o={
      type:$("type").value,
      amt:a,
      note:$("note").value.trim(),
      cat:$("cat")&&!$("cat").value.startsWith("__")?$("cat").value:"",
      date:$("date").value||today(),
      time:nowTime(),
      ts:Date.now()
    };


    if($("rep").checked){

      S.rec=S.rec||[];

      S.rec.push({
        id:uid(),
        bid:b.id,
        ...o,
        day:+o.date.slice(8),
        next:o.date
      });

      applyRec();

    }

    else{

      const nid=uid();
      fresh=nid;
      setTimeout(()=>{fresh=null;},900);
      b.tx.push({id:nid,...o});
      toast("Added ✓");

    }

    save();

  };


  document.querySelectorAll("[data-r]").forEach(el=>
    el.onclick=async()=>{

      const v=await dlg({
        title:"Stop this recurring item?",
        msg:"Are you sure? Past transactions stay; future ones won't be added.",
        ok:"Stop it"
      });

      if(v){

        S.rec=S.rec.filter(r=>r.id!==el.dataset.r);

        save();

      }

    }
  );


  $("exp").onclick=()=>
    exportCSV([b],b.name.replace(/\W+/g,"-").toLowerCase());


  document.querySelectorAll("[data-d]").forEach(el=>
    el.onclick=async()=>{

      const t=b.tx.find(x=>x.id===el.dataset.d);

      const v=await dlg({
        title:"Remove this transaction?",
        msg:"Are you sure you want to remove "+
          (t&&t.note?t.note+" ("+fmt(t.amt)+")":"it")+"?",
        ok:"Remove"
      });

      if(v){

        b.tx=b.tx.filter(x=>x.id!==el.dataset.d);

        save();

      }

    }
  );


  $("lim").onclick=async()=>{

    const sp=b.kind!=="save" && b.kind!=="invest";

    const v=await dlg({

      title:
        b.kind==="save"
        ?"Savings goal"
        :b.kind==="invest"
        ?"Investment goal"
        :"Spending limit",

      msg:sp
        ?"Set how much you can spend and for how many days (e.g. 3500 for 7 days). Use 0 days for no time period."
        :"Use 0 for none.",

      fields:[{id:"v",label:"Amount",type:"number",value:b.limit||0}].concat(sp?[
        {id:"d",label:"Days in period (0 = no period)",type:"number",value:b.period?b.period.days:0},
        {id:"s",label:"Start date",type:"date",value:b.period?b.period.start:today()}
      ]:[])

    });

    if(v){

      b.limit=parseFloat(v.v)||0;

      if(sp){
        const dy=parseInt(v.d)||0;
        b.period=dy>0&&b.limit>0?{days:dy,start:v.s||today()}:null;
      }

      save();

    }

  };


  if($("np"))
    $("np").onclick=()=>{
      b.period={days:b.period.days,start:today()};
      save();
    };


  if($("val"))
    $("val").onclick=async()=>{

      const v=await dlg({
        title:"Current value",
        msg:"What is this investment worth right now?",
        fields:[{id:"v",label:"Current value",type:"number",value:b.value??""}]
      });

      if(v && v.v!==""){

        b.value=parseFloat(v.v)||0;

        save();

      }

    };


  $("ren").onclick=async()=>{

    const v=await dlg({
      title:"Rename budget",
      fields:[{id:"n",label:"Name",value:b.name}]
    });

    if(v && v.n.trim()){

      b.name=v.n.trim();

      save();

    }

  };


  $("del").onclick=async()=>{

    const v=await dlg({
      title:"Delete "+b.name+"?",
      msg:"All its transactions will be removed.",
      ok:"Delete"
    });

    if(v){

      S.budgets=S.budgets.filter(x=>x.id!==b.id);

      S.rec=(S.rec||[]).filter(r=>r.bid!==b.id);

      cur="all";

      save();

    }

  };

}

/* =========================
   SIGN IN / CREATE ACCOUNT
========================= */

async function signIn(){

  const v=await dlg({

    title:"Cloud Sync",

    msg:"Sign in or create an account to sync your budgets across your devices.",

    ok:"Continue",

    fields:[

      {id:"m",label:"Email",type:"email"},

      {id:"p",label:"Password",type:"password"},

      {
        id:"a",
        label:"Action",
        options:[["in","Sign in"],["up","Create account"]]
      }

    ]

  });


  if(!v)return;


  try{

    if(!v.m || !v.p){

      $("sync").textContent="Enter email and password";

      return;

    }


    await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);


    if(v.a==="up"){

      await auth.createUserWithEmailAndPassword(v.m,v.p);

    }

    else{

      await auth.signInWithEmailAndPassword(v.m,v.p);

    }


  }catch(e){

    console.error(e);

    let message="Unable to sign in.";

    if(e.code==="auth/configuration-not-found"){
      message="Enable Email/Password in Firebase Authentication.";
    }
    else if(e.code==="auth/email-already-in-use"){
      message="That email already has an account.";
    }
    else if(e.code==="auth/invalid-email"){
      message="Invalid email address.";
    }
    else if(e.code==="auth/weak-password"){
      message="Password must be at least 6 characters.";
    }
    else if(e.code==="auth/wrong-password" || e.code==="auth/invalid-credential"){
      message="Incorrect email or password.";
    }
    else if(e.code==="auth/user-not-found"){
      message="No account exists with that email.";
    }

    $("sync").textContent=message;

  }

}


/* =========================
   SYNC BUTTON
========================= */

$("sync").onclick=()=>{

  if(!fbOn){

    $("sync").textContent="Firebase unavailable";

    return;

  }

  if(auth.currentUser){

    auth.signOut();

  }

  else{

    signIn();

  }

};


/* =========================
   FIREBASE AUTH STATE
========================= */

if(fbOn){

  auth.onAuthStateChanged(async user=>{

    if(unsub){

      unsub();

      unsub=null;

    }

    ref=null;

    ready=false;

    if(!user){

      $("sync").textContent="Tap to sign in & sync";

      return;

    }

    ref=fdb.collection("budgets").doc(user.uid);

    unsub=ref.onSnapshot(

      async snap=>{

        try{

          if(snap.exists){

            const data=snap.data();

            if(data && data.json && !snap.metadata.hasPendingWrites && !saving){

              S=JSON.parse(data.json);

              try{
                localStorage.setItem(KEY,data.json);
              }catch(e){}

              render();

            }

          }

          else if(!ready){

            const json=JSON.stringify(S);

            await ref.set({
              json:json,
              updatedAt:firebase.firestore.FieldValue.serverTimestamp()
            });

          }

          ready=true;

          $("sync").textContent="Synced ✓";

        }catch(e){

          console.error("Firestore sync error:",e);

          $("sync").textContent="Sync error";

        }

      },

      error=>{

        console.error("Firestore listener error:",error);

        $("sync").textContent="Firestore permission error";

      }

    );

  });

}

else{

  $("sync").textContent="Firebase failed to initialize";

}


/* =========================
   START APP
========================= */

lsGet();

if(applyRec())
  save();
else
  render();

</script>
